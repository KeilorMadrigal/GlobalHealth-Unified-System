# pg_hba.conf del maestro — instalado durante la inicialización sobre el
# archivo generado por initdb (ver docker/master/init-master.sh).
#
# Es deliberadamente permisivo en origen (0.0.0.0/0) porque todo el tráfico
# queda contenido dentro de la red bridge privada 'globalhealth-net' de
# Docker; ningún puerto de PostgreSQL además del propio host mapping queda
# expuesto a Internet. Para un entorno productivo real se restringiría a los
# rangos CIDR de los contenedores conocidos.

# TYPE    DATABASE        USER            ADDRESS                 METHOD
local     all             all                                     trust
host      all             all             127.0.0.1/32            scram-sha-256
host      all             all             0.0.0.0/0               scram-sha-256

# Conexión exclusiva de replicación física para el rol 'replicador'
# (usado por pg-replica vía pg_basebackup y por el streaming continuo).
host      replication     replicador      0.0.0.0/0               scram-sha-256
