# Fragmento de configuración de replicación — se anexa a postgresql.conf del
# maestro durante la inicialización (ver docker/master/init-master.sh).
# No es un postgresql.conf completo: initdb ya generó el resto de valores por
# defecto, esto solo agrega/sobreescribe lo necesario para streaming replication.

# --- Replicación física (Fase 1) ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 512MB
hot_standby = on

# El maestro debe ser alcanzable desde el contenedor de la réplica y desde
# los otros nodos (fragmentación, Fase 5) dentro de la red globalhealth-net.
listen_addresses = '*'
